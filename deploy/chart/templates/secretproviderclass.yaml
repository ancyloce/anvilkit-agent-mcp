{{- include "anvilkit-agent-mcp.require" . -}}
{{- if eq .Values.secrets.provider "csi" }}
{{- $c := .Values.secrets.csi }}
{{- $keys := list "database-url" "nats-creds" }}
{{- if .Values.relay.enabled }}{{ $keys = concat $keys (list "relay-database-url" "relay-queue-url" "relay-nats-creds") }}{{ end }}
# P0.6: the service's credentials from OpenBao (no Kubernetes Secret): one
# file per key of the service's KV v2 path, world-readable inside the Pod's
# own volume (the containers run as non-root users).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "anvilkit-agent-mcp.fullname" . }}
  labels:
    {{- include "anvilkit-agent-mcp.labels" . | nindent 4 }}
spec:
  provider: openbao
  parameters:
    baoAddress: {{ $c.address | quote }}
    {{- with $c.caCertPath }}
    baoCACertPath: {{ . | quote }}
    {{- end }}
    roleName: {{ default (include "anvilkit-agent-mcp.serviceAccountName" .) $c.role | quote }}
    audience: {{ $c.audience | quote }}
    objects: |
      {{- range $keys }}
      - objectName: {{ . | quote }}
        secretPath: {{ $c.path | quote }}
        secretKey: {{ . | quote }}
        filePermission: 0444
      {{- end }}
{{- end }}
