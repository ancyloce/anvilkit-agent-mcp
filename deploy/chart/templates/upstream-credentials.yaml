{{- if .Values.upstream.credentials }}
{{- $csi := eq .Values.secrets.provider "csi" }}
{{- $out := list }}
{{- range .Values.upstream.credentials }}
{{- $file := ternary (printf "/var/run/secrets/anvilkit/csi/upstream-%s" .secretKey) (printf "/var/run/secrets/anvilkit/upstream/%s" .secretKey) $csi }}
{{- $out = append $out (dict "resource" .resource "issuer" .issuer "clientId" .clientId "clientSecretFile" $file "scopes" (.scopes | default list)) }}
{{- end }}
# P2.5: the reviewed upstream credential bindings
# (ANVILKIT_MCP_UPSTREAM_CREDENTIALS_FILE): no secret here, each client
# secret is its own mounted file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anvilkit-agent-mcp.fullname" . }}-upstream
  labels:
    {{- include "anvilkit-agent-mcp.labels" . | nindent 4 }}
data:
  credentials.json: {{ toJson $out | quote }}
{{- end }}
