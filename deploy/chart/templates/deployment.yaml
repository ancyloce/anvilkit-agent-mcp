{{- include "anvilkit-agent-mcp.require" . -}}
{{- $cfg := include "anvilkit-agent-mcp.config" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvilkit-agent-mcp.fullname" . }}
  labels:
    {{- include "anvilkit-agent-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "anvilkit-agent-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anvilkit-agent-mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ $cfg | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "anvilkit-agent-mcp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # No injected service-link variables: the configuration loader rejects
      # any ANVILKIT_MCP_* variable outside its allowlist.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          image: {{ include "anvilkit-agent-mcp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ANVILKIT_MCP_CONFIG
              value: /etc/anvilkit/anvilkit-agent-mcp/config.yaml
            - name: ANVILKIT_MCP_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.listen.port) | quote }}
            - name: ANVILKIT_MCP_HEALTH_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.health.port) | quote }}
            {{- if .Values.telemetry.otlpEndpoint }}
            - name: ANVILKIT_MCP_TELEMETRY_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            {{- end }}
            # The secret as a mounted file: the kubelet refreshes it when the
            # Secret changes and the generation watcher publishes the new
            # generation (a new pool, probed, then the old one drained).
            - name: ANVILKIT_MCP_DATABASE_URL_FILE
              value: /var/run/secrets/anvilkit/database/{{ .Values.database.secret.key }}
            - name: ANVILKIT_MCP_NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- if .Values.control.address }}
            - name: ANVILKIT_MCP_CONTROL_ADDRESS
              value: {{ .Values.control.address | quote }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
          # The probes target the plaintext health listener: the kubelet
          # presents no client certificate and the mTLS business listener
          # refuses a handshake without one.
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/anvilkit/anvilkit-agent-mcp
              readOnly: true
            - name: database
              mountPath: /var/run/secrets/anvilkit/database
              readOnly: true
            {{- if eq .Values.identity.mode "mtls" }}
            - name: identity
              mountPath: /etc/anvilkit/identity
              readOnly: true
            {{- end }}
            {{- if ne .Values.nats.tls.mode "development" }}
            - name: nats-ca
              mountPath: /etc/anvilkit/nats-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.telemetry.otlpEndpoint (ne .Values.telemetry.otlpTls.mode "development") }}
            - name: otlp-ca
              mountPath: /etc/anvilkit/otlp-ca
              readOnly: true
            {{- end }}
        {{- if .Values.relay.enabled }}
        - name: relay
          image: {{ include "anvilkit-agent-mcp.relayImage" . | quote }}
          imagePullPolicy: {{ .Values.relay.image.pullPolicy }}
          args: ["relay"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ANVILKIT_BACKGROUND_WORKER_CONFIG
              value: /etc/anvilkit/anvilkit-agent-background-worker/config.yaml
            - name: ANVILKIT_BACKGROUND_WORKER_RELAY_OWNER
              value: mcp
            - name: ANVILKIT_BACKGROUND_WORKER_MCP_ADDRESS
              value: {{ printf "127.0.0.1:%d" (int .Values.listen.port) | quote }}
            - name: ANVILKIT_BACKGROUND_WORKER_HEALTH_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.relay.healthPort) | quote }}
            - name: ANVILKIT_BACKGROUND_WORKER_NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: ANVILKIT_BACKGROUND_WORKER_RELAY_DATABASE_URL_FILE
              value: /var/run/secrets/anvilkit/relay-database/{{ .Values.relay.database.secret.key }}
            - name: ANVILKIT_BACKGROUND_WORKER_QUEUE_URL_FILE
              value: /var/run/secrets/anvilkit/queue/{{ .Values.relay.queue.secret.key }}
            # The relay dials this owner's BackgroundTaskService with the Pod's
            # workload certificate (the MCP identity) under identity.mode.
            - name: ANVILKIT_BACKGROUND_WORKER_IDENTITY_MODE
              value: {{ .Values.identity.mode | quote }}
            {{- if eq .Values.identity.mode "mtls" }}
            - name: ANVILKIT_BACKGROUND_WORKER_IDENTITY_CERT_FILE
              value: /etc/anvilkit/identity/tls.crt
            - name: ANVILKIT_BACKGROUND_WORKER_IDENTITY_KEY_FILE
              value: /etc/anvilkit/identity/tls.key
            - name: ANVILKIT_BACKGROUND_WORKER_IDENTITY_CA_FILE
              value: /etc/anvilkit/identity/ca.crt
            - name: ANVILKIT_BACKGROUND_WORKER_OWNER_SERVER_NAME
              value: {{ include "anvilkit-agent-mcp.fullname" . | quote }}
            {{- end }}
          ports:
            - name: relay-health
              containerPort: {{ .Values.relay.healthPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: relay-health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: relay-health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.relay.resources | nindent 12 }}
          volumeMounts:
            - name: relay-database
              mountPath: /var/run/secrets/anvilkit/relay-database
              readOnly: true
            - name: queue
              mountPath: /var/run/secrets/anvilkit/queue
              readOnly: true
            {{- if eq .Values.identity.mode "mtls" }}
            - name: identity
              mountPath: /etc/anvilkit/identity
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anvilkit-agent-mcp.fullname" . }}
        - name: database
          secret:
            secretName: {{ .Values.database.secret.name }}
        {{- if .Values.relay.enabled }}
        - name: relay-database
          secret:
            secretName: {{ .Values.relay.database.secret.name }}
        - name: queue
          secret:
            secretName: {{ .Values.relay.queue.secret.name }}
        {{- end }}
        {{- if eq .Values.identity.mode "mtls" }}
        - name: identity
          secret:
            secretName: {{ include "anvilkit-agent-mcp.identitySecret" . }}
            defaultMode: 0440
        {{- end }}
        {{- if ne .Values.nats.tls.mode "development" }}
        - name: nats-ca
          secret:
            secretName: {{ .Values.nats.tls.caSecret.name }}
            items:
              - key: {{ .Values.nats.tls.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- if and .Values.telemetry.otlpEndpoint (ne .Values.telemetry.otlpTls.mode "development") }}
        - name: otlp-ca
          secret:
            secretName: {{ .Values.telemetry.otlpTls.caSecret.name }}
            items:
              - key: {{ .Values.telemetry.otlpTls.caSecret.key }}
                path: ca.crt
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
