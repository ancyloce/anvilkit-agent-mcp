apiVersion: v1
kind: Service
metadata:
  name: {{ include "anvilkit-agent-mcp.fullname" . }}
  labels:
    {{- include "anvilkit-agent-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "anvilkit-agent-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
    - name: metrics
      port: {{ .Values.health.port }}
      targetPort: health
      protocol: TCP
