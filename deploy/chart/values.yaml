# Chart values of anvilkit-agent-mcp. Only what this service needs: its
# image, its reviewed configuration file, the allowlisted placement
# overrides, the Secrets it reads its credentials from, probes, resources
# and the owner queue relay sidecar (P14: the relay of this owner's
# background.requested events into its BullMQ queues, run beside the service
# from the background-worker image with the relay role). Environment values
# (addresses, replica counts, Secret names, the pinned image digests) are
# supplied by the deploying repository per environment; secrets never enter
# this chart.

image:
  repository: anvilkit-agent-mcp
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 2

# HorizontalPodAutoscaler (autoscaling/v2). Off unless the environment enables
# it with an explicit maxReplicas: the maximum is bounded by downstream caps
# and the database connection budget (deploy/gitops/lock.yaml), never a chart
# default. While enabled the Deployment leaves replicas to the autoscaler.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 0
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# The gRPC listener inside the Pod (ANVILKIT_MCP_LISTEN); under
# identity.mode mtls it is mTLS-only and no probe targets it. The plaintext
# probe/metrics listener (ANVILKIT_MCP_HEALTH_LISTEN): /healthz, /readyz and
# /metrics only, bound on the Pod IP for the kubelet, not exposed by the
# Service.
listen:
  address: 0.0.0.0
  port: 9106
health:
  port: 9116

# The listener's workload identity (P0.1). mtls (the default) serves TLS 1.3
# with required client certificates verified against the mounted CA bundle
# and authorizes every RPC by the peer's SPIFFE URI SAN
# (spiffe://<trustDomain>/ns/<namespace>/sa/<service-account>) under the
# reviewed allowlist; the same certificate is the identity the Control
# clients and the relay container present. The certificate is a cert-manager
# Certificate this chart renders (certificate.create) from issuerRef, or an
# existing Secret (secretName, keys tls.crt, tls.key, ca.crt) when create is
# false; the files are mounted at /etc/anvilkit/identity and reloaded as a
# whole. development is the plaintext listener of the development
# foundation and renders only with development.enabled: true.
identity:
  mode: mtls
  trustDomain: ""
  secretName: ""
  certificate:
    create: true
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 720h
  maxConnectionAge: 1h

# The top-level DEVELOPMENT_ONLY guard: every development transport below
# (identity.mode, control.identity.mode, nats.tls.mode,
# telemetry.otlpTls.mode) renders only while this is true; it downgrades
# nothing by itself.
development:
  enabled: false

# Credential delivery (P0.6). kubernetes mounts the existing Secrets named
# below (database.secret, nats.credentials.secret, relay.database.secret,
# relay.queue.secret): the development foundation's path. csi mounts the
# credentials from OpenBao through the Secrets Store CSI driver (provider
# openbao, Kubernetes auth with the Pod's ServiceAccount token of audience
# csi.audience; no Kubernetes Secret is synced) read-only at
# /var/run/secrets/anvilkit/csi in both containers; the service's KV v2 path
# holds database-url and nats-creds (the forwarder's) and relay-database-url,
# relay-queue-url and relay-nats-creds (the relay's). A rotated file publishes
# a new configuration generation (database) or is read on reconnect (NATS).
secrets:
  provider: kubernetes
  csi:
    address: ""
    caCertPath: ""
    audience: openbao
    role: ""
    path: ""

# P0.6: the data plane's CA bundle: a ConfigMap (key ca.crt) in this
# namespace, e.g. the anvilkit-trust map deploy/qualification/bootstrap.py
# maintains. Mounted at /etc/anvilkit/trust in every container that connects
# to PostgreSQL (the DSNs' sslrootcert names /etc/anvilkit/trust/ca.crt) or
# an HTTPS data store, and added to the Node processes' roots
# (NODE_EXTRA_CA_CERTS). Empty: the image's roots only.
trust:
  configMap: ""

# The application-role connection: a Secret mounted as a file
# (ANVILKIT_MCP_DATABASE_URL_FILE) so a rotated secret publishes a new
# configuration generation without a restart. Required; never created here.
database:
  secret:
    name: ""
    key: url

# The JetStream placement of the in-process forwarder (ANVILKIT_MCP_NATS_URL).
# Required. tls is the transport: tls verifies the server against the CA
# bundle of caSecret (key ca.crt); mtls additionally presents the workload
# certificate of identity; development is the plaintext NATS of the
# development foundation (development.enabled only).
nats:
  url: ""
  tls:
    mode: tls
    caSecret:
      name: ""
      key: ca.crt
  # The NATS user credentials (P0.6): an NKey seed or a .creds file each for
  # the forwarder (ANVILKIT_MCP_NATS_CREDS_FILE) and the relay
  # (ANVILKIT_BACKGROUND_WORKER_NATS_CREDS_FILE). Under secrets.provider
  # kubernetes an existing Secret with the two keys below; required outside
  # development (the server admits no anonymous client).
  credentials:
    secret:
      name: ""
      forwarderKey: forwarder
      relayKey: relay

# The Control placement of the original-dispatch query and the grant barrier
# (ANVILKIT_MCP_CONTROL_ADDRESS); optional. identity.mode mtls presents the
# workload certificate and verifies Control by serverName; development is
# plaintext (development.enabled only).
control:
  address: ""
  identity:
    mode: mtls
    serverName: anvilkit-agent-control

# The owner queue relay sidecar (the background-worker image's relay entry):
# consumes this owner's background.requested subject with the fixed durable
# consumer, commits inbox entries with the relay role, enqueues into this
# owner's BullMQ queues on the queue Valkey and reconstructs missing entries
# from the durable requests. Its database URL (relay role) and its queue
# Valkey URL are secrets read from existing Secrets.
relay:
  enabled: true
  image:
    repository: anvilkit-agent-background-worker
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  database:
    secret:
      name: ""
      key: url
  queue:
    secret:
      name: ""
      key: url
    # The queue Valkey's CA inside the Pod for a rediss:// URL
    # (ANVILKIT_BACKGROUND_WORKER_QUEUE_TLS_CA_FILE), e.g. the cluster CA of
    # the workload identity /etc/anvilkit/identity/ca.crt; empty uses the
    # image's roots.
    tls:
      caFile: ""
  healthPort: 9126
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# The reviewed, secret-free configuration file (config.yaml sections),
# rendered into a ConfigMap and mounted at ANVILKIT_MCP_CONFIG.
config:
  grpc:
    listen: 127.0.0.1:9106
    capacity: 64
    shutdown_timeout: 20s
    identity:
      reload_interval: 5s
  health:
    listen: 127.0.0.1:9116
  database:
    max_conn: 8
  tasks:
    max_input_bytes: 65536
    max_lease: 10m
    retry_delay: 5s
    max_attempts: 3
    sweep_interval: 2s
  outbox:
    forwarder_enabled: true
    consumer_group: anvilkit-agent-mcp-forwarder
    poll_interval: 500ms
    ack_deadline: 30s
    resend_interval: 1s
    batch_size: 100
    nats:
      publish_timeout: 5s
      name: anvilkit-agent-mcp
  control:
    timeout: 5s
  apollo:
    mode: disabled
    app_id: anvilkit-agent-mcp
  reload:
    interval: 2s
    drain_limit: 30s

service:
  type: ClusterIP
  port: 9106

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 30
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# Derived from the drains: the gRPC drain, the loops and the generation
# retire are bounded by config; the grace period must exceed their sum.
terminationGracePeriodSeconds: 90

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# A voluntary disruption (node drain, rollout) keeps at least one Pod serving.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Telemetry placement (P23): the collector's OTLP endpoint for spans
# (ANVILKIT_MCP_TELEMETRY_OTLP_ENDPOINT) (the metrics are on the health listener's /metrics); empty disables it.
# Scraping is the environment's pod annotations.
telemetry:
  otlpEndpoint: ""
  # The collector transport while otlpEndpoint is set: tls verifies the
  # collector against caSecret (key ca.crt) and serverName, mtls also presents
  # the workload certificate, development is plaintext (development.enabled).
  otlpTls:
    mode: tls
    serverName: ""
    caSecret:
      name: ""
      key: ca.crt
