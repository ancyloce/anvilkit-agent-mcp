# Independent verification of anvilkit-agent-mcp from this repository alone:
# build, vet, test (Docker-backed PostgreSQL 17 tests through Testcontainers;
# they need the anvilkit_mcp migrations, which still live in the parent
# repository's migration Job until MCP owns them — the checkout of
# anvilkit-services below supplies them read-only), the race check of the
# application, domain and transport, the sqlc drift check, the image from
# the repository root, and the chart's lint and render. GOWORK=off: the
# contract module is a versioned requirement.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
env:
  # anvilkit-services commit whose jobs/migration/internal/migrate/sql holds
  # the migrations this repository's tests apply (MIG-02: pinned, never the
  # parent's moving default branch; bump it with every migration the
  # service starts to depend on).
  PARENT_REF: 4f09188a22da1ff1674dbb26606aca022b4d2fbe
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"
  ANVILKIT_MCP_MIGRATIONS_DIR: ${{ github.workspace }}/parent/jobs/migration/internal/migrate/sql/mcp
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ancyloce/anvilkit-services
          ref: ${{ env.PARENT_REF }}
          path: parent
          # The schema and its DEVELOPMENT_ONLY fixture set (the local-check
          # task kind the tests insert), which internal/testdb applies after it.
          sparse-checkout: |
            jobs/migration/internal/migrate/sql/mcp
            jobs/migration/internal/migrate/sql/mcp-development
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.0"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./internal/application/... ./internal/transport/... ./internal/domain/...
  sqlc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ancyloce/anvilkit-services
          ref: ${{ env.PARENT_REF }}
          path: parent
          # The schema and its DEVELOPMENT_ONLY fixture set (the local-check
          # task kind the tests insert), which internal/testdb applies after it.
          sparse-checkout: |
            jobs/migration/internal/migrate/sql/mcp
            jobs/migration/internal/migrate/sql/mcp-development
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.0"
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
      - run: sh tools/sqlc.sh --check
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t anvilkit-agent-mcp:ci .
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.19.0"
      - run: >-
          helm lint deploy/chart --set database.secret.name=mcp-database --set nats.url=tls://nats:4222 --set identity.trustDomain=ci.example --set identity.certificate.issuerRef.name=ci-issuer --set nats.tls.caSecret.name=nats-ca
          --set relay.database.secret.name=mcp-relay-database --set relay.queue.secret.name=queue-valkey --set nats.credentials.secret.name=mcp-nats
      - run: >-
          helm template anvilkit-agent-mcp deploy/chart --set database.secret.name=mcp-database --set nats.url=tls://nats:4222 --set identity.trustDomain=ci.example --set identity.certificate.issuerRef.name=ci-issuer --set nats.tls.caSecret.name=nats-ca
          --set relay.database.secret.name=mcp-relay-database --set relay.queue.secret.name=queue-valkey --set nats.credentials.secret.name=mcp-nats > /dev/null
